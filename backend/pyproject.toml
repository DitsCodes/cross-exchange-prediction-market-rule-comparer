[project]
name = "rulec-backend"
version = "0.1.0"
description = "Cross-Platform Prediction Market Rules Comparer (FastAPI + LangGraph + Postgres pg_trgm)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "slowapi>=0.1.9",
    "langgraph>=0.2.50",
    "langgraph-supervisor>=0.0.10",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.20",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
